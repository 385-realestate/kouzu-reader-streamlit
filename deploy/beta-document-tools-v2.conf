server {
    server_name beta.385-realestate.com;

    root /opt/apps/realor-map-app/frontend/dist;
    index index.html;

    location = /touki { return 301 /touki/; }
    location /touki/ {
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
    }

    location = /kouzu { return 301 /kouzu/; }
    location = /kouzu/legacy { return 301 /kouzu/legacy/; }
    location = /kouzu/legacy/ {
        alias /opt/apps/kouzu-reader/kouzu_reader.html;
        default_type text/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    location /kouzu/ {
        proxy_pass http://127.0.0.1:8511;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8503/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/beta.385-realestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.385-realestate.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = beta.385-realestate.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name beta.385-realestate.com;
    return 404;
}
